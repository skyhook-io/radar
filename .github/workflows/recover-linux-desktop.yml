name: Recover Linux desktop 1.20.3
on:
  push:
    branches:
      - recovery/linux-desktop-1.20.3
permissions:
  contents: read
env:
  RELEASE_TAG: v1.20.3
jobs:
  build-linux:
    name: Linux (amd64)
    runs-on: ubuntu-22.04
    # This job runs third-party packaging tools (linuxdeploy and its GTK
    # plugin); it uploads through the artifact service and never writes to
    # the repository, so it gets a read-only token that is not left on disk.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bb22349bef1be6347ca1c4661c7c5a16fffb028c
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev imagemagick

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install nfpm
        env:
          NFPM_VERSION: '2.49.0'
          NFPM_SHA256: '2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/nfpm-bin"
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP/nfpm-bin" nfpm
          echo "$RUNNER_TEMP/nfpm-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nfpm-bin/nfpm" --version

      - name: Build frontend
        run: make frontend embed

      - name: Create dummy kubeconfig for Wails binding generation
        run: |
          mkdir -p ~/.kube
          echo 'apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://localhost:6443
            name: dummy
          contexts:
          - context:
              cluster: dummy
              user: dummy
            name: dummy
          current-context: dummy
          users:
          - name: dummy
            user:
              token: dummy' > ~/.kube/config

      - name: Build Linux binary
        run: |
          cd cmd/desktop && wails build -platform linux/amd64 -tags webkit2_41 -ldflags "-X main.version=${RELEASE_TAG#v}"
          mv ../../build/bin/Radar ../../build/bin/radar-desktop

      - name: Create archive
        run: |
          VERSION="${RELEASE_TAG}"
          cd build/bin
          tar czf "../../radar-desktop_${VERSION}_linux_amd64.tar.gz" radar-desktop
          cd ../..

      - name: Build .deb and .rpm packages
        run: |
          TAG="${RELEASE_TAG}"
          export VERSION="${TAG#v}"
          nfpm package --config deploy/linux/nfpm.yaml --packager deb --target "radar-desktop_${TAG}_linux_amd64.deb"
          nfpm package --config deploy/linux/nfpm.yaml --packager rpm --target "radar-desktop_${TAG}_linux_amd64.rpm"

      - name: Build AppImage
        run: scripts/build-appimage.sh build/bin/radar-desktop "${RELEASE_TAG}"

      - name: Generate checksums
        run: |
          VERSION="${RELEASE_TAG}"
          sha256sum "radar-desktop_${VERSION}_linux_amd64.tar.gz" >> checksums-linux.txt
          sha256sum "radar-desktop_${VERSION}_linux_amd64.deb" >> checksums-linux.txt
          sha256sum "radar-desktop_${VERSION}_linux_amd64.rpm" >> checksums-linux.txt
          sha256sum "radar-desktop_${VERSION}_linux_amd64.AppImage" >> checksums-linux.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            radar-desktop_*.tar.gz
            radar-desktop_*.deb
            radar-desktop_*.rpm
            radar-desktop_*.AppImage
            checksums-linux.txt
          retention-days: 1

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Linux Desktop Build"
            echo ""
            if ls radar-desktop_*.tar.gz 1>/dev/null 2>&1; then
              echo "**Status:** Success"
              ls -lh radar-desktop_*.tar.gz radar-desktop_*.deb radar-desktop_*.rpm radar-desktop_*.AppImage 2>/dev/null | awk '{print "- `" $NF "` (" $5 ")"}'
            else
              echo "**Status:** Failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
