name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels its running checks. Other runs get a unique group:
# a shared one would queue main pushes and drop the pending ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pushes to main rerun every Go test instead of reusing results cached from an
# earlier run; PRs keep the cache. Go applies -count only to go test.
env:
  GOFLAGS: ${{ github.event_name == 'push' && '-count=1' || '' }}

jobs:
  # Decides which jobs a PR needs from every file it changes, not only those in
  # the latest push. Pushes to main, and any PR touching .github/,
  # run every job, so a gap in these filters surfaces on main at the latest.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pkg: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.pkg == 'true' }}
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.go == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.web == 'true' }}
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.app == 'true' }}
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' || steps.filter.outputs.helm == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            ci:
              - '.github/**'
            pkg:
              - 'pkg/**'
              - 'testdata/**'
              - 'go.work*'
            # Go tests also read files outside Go packages: the chart, shared
            # golden fixtures, docs and README, and frontend sources they keep
            # in sync with. A new test that reads another path needs it here.
            # (The repo-wide hygiene test has its own job, repo-hygiene.)
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work*'
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - '**/testdata/**'
              - 'deploy/helm/**'
              - 'scripts/gpu-ecosystem-demo/**'
              - 'README.md'
              - 'docs/mcp.md'
              - 'docs/reachability.md'
              - 'web/src/api/radarFeatures.ts'
              - 'web/src/components/home/mcpToolCatalog.ts'
              - 'web/src/components/resources/renderers/**'
              - 'packages/k8s-ui/src/components/workload/WorkloadView.tsx'
              - 'packages/k8s-ui/src/components/trace/reachVerdict.ts'
              - 'packages/k8s-ui/src/components/resources/resource-utils-cnpg.ts'
            # Frontend and k8s-ui tests read Go golden fixtures, the chart's
            # read baseline and the GPU ecosystem registry, and run scripts/.
            web:
              - 'web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '**/testdata/**'
              - 'deploy/helm/radar/files/**'
              - 'scripts/gpu-ecosystem-demo/**'
              - 'scripts/workload-metrics-demo/**'
              - 'scripts/check-whats-new.sh'
            # What the settings browser journeys build and serve: the frontend
            # embedded in cmd/testserver. Go tests and their fixtures are not part
            # of it; web fixtures are, since the build type-checks web tests.
            app:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work*'
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - 'web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - 'Makefile'
              - '!**/*_test.go'
              - '!{cmd,internal,pkg}/**/testdata/**'
            helm:
              - 'deploy/helm/**'
              - 'scripts/test-chart.sh'

  pkg:
    name: pkg (shared library)
    needs: changes
    if: needs.changes.outputs.pkg == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          # Its own build cache: sharing the root module's key let this job,
          # which finishes first, save a cache holding only pkg's packages.
          cache-dependency-path: pkg/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Evaluate workload PromQL in Prometheus
        env:
          RADAR_TEST_PROMTOOL_IMAGE: prom/prometheus:v3.5.0
        run: go test ./prom -run '^TestWorkload(History)?PromQL$' -count=1

      - name: Build
        run: go build ./...

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: |
            go.sum
            pkg/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -w needed on:"
            echo "$unformatted"
            exit 1
          fi

      # internal/server runs in its own job; it is the slowest package by far.
      # The assignment fails the step if go list does; an argument would not.
      # The PostgreSQL tests (internal/timeline, internal/k8s) run here too,
      # against the service above.
      - name: Run tests
        env:
          RADAR_TEST_POSTGRES_DSN: postgres://radar:radar@localhost:5432/radar?sslmode=disable
          # Turns a missing DSN into a failure instead of a silent skip: without
          # it, losing the service or the env block above would leave the whole
          # PostgreSQL backend untested while this job still reported green.
          RADAR_REQUIRE_POSTGRES_TESTS: "1"
        run: |
          pkgs=$(go list ./...)
          go test $(grep -vx 'github.com/skyhook-io/radar/internal/server' <<<"$pkgs")

      - name: Evaluate PVC and CNPG PromQL in Prometheus
        env:
          RADAR_TEST_PROMTOOL_IMAGE: prom/prometheus:v3.5.0
        run: go test ./internal/prometheus -run '^(TestPVCScopePromQL|TestCNPGDiskGrowthPromQL)$' -count=1

      - name: Build
        run: go build -o explorer ./cmd/explorer

  backend-server:
    name: Backend (internal/server)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: |
            go.sum
            pkg/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./internal/server

  # TestNoEffortNotesReferencedFromSource scans the whole repo (.ts, .md, .sh,
  # .yaml, ...), not only Go code. When Backend is skipped, run it alone.
  repo-hygiene:
    name: Repo hygiene
    needs: changes
    if: needs.changes.outputs.go != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: |
            go.sum
            pkg/go.sum

      - name: Check for effort-note paths
        run: go test ./internal/server -run '^TestNoEffortNotesReferencedFromSource$'

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run tsc
        working-directory: web

      - name: Test
        run: npm run test
        working-directory: web

      - name: Test metrics evidence capture
        run: node --test scripts/workload-metrics-demo/capture.test.mjs

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  settings-browser:
    name: Settings browser journeys
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: |
            go.sum
            pkg/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: make build
      - run: npm run test:e2e:settings
        working-directory: web

  k8s-ui:
    name: k8s-ui (shared UI)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Radar's own type-check covers k8s-ui source through imports, never its tests.
      - name: Type-check (including tests)
        run: npm run tsc
        working-directory: packages/k8s-ui

      - name: Run tests
        run: npm test
        working-directory: packages/k8s-ui

  helm:
    name: Helm chart
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          # Explicit pin (never `latest` — runner caches made green/red a
          # lottery). Helm 4 on purpose: it's what new users install with,
          # and lint/template/negative-tests are the chart's user-facing
          # surface. The unittest step below stays on Helm 3.
          version: v4.2.3

      - name: Lint
        run: helm lint deploy/helm/radar

      - name: Render default values
        run: helm template radar deploy/helm/radar > /dev/null

      - name: Render cloud.enabled with inline token
        run: |
          helm template radar deploy/helm/radar \
            --set cloud.enabled=true \
            --set cloud.url=wss://cloud.example/agent \
            --set cloud.clusterName=test \
            --set cloud.token=rhc_deadbeef > /dev/null

      - name: Render cloud.enabled with existingSecret
        run: |
          helm template radar deploy/helm/radar \
            --set cloud.enabled=true \
            --set cloud.url=wss://cloud.example/agent \
            --set cloud.clusterName=test \
            --set cloud.existingSecret=my-cloud-token > /dev/null

      - name: Reject cloud.enabled without token or existingSecret
        run: |
          if helm template radar deploy/helm/radar \
            --set cloud.enabled=true \
            --set cloud.url=wss://cloud.example/agent \
            --set cloud.clusterName=test 2>/dev/null; then
            echo "ERROR: helm template should have failed with no token set"
            exit 1
          fi

      - name: Render Argo CD integration with inline token
        run: |
          helm template radar deploy/helm/radar \
            --set argocd.token=argo_deadbeef \
            --set argocd.url=https://argocd.example.com > /dev/null

      - name: Render Argo CD integration with existingSecret
        run: |
          helm template radar deploy/helm/radar \
            --set argocd.existingSecret=my-argo-token > /dev/null

      - name: Reject Argo CD token and existingSecret together
        run: |
          if helm template radar deploy/helm/radar \
            --set argocd.token=argo_deadbeef \
            --set argocd.existingSecret=my-argo-token 2>/dev/null; then
            echo "ERROR: helm template should have failed with both token and existingSecret set"
            exit 1
          fi

      - name: Render PostgreSQL timeline storage with existingSecret
        run: |
          helm template radar deploy/helm/radar \
            --set timeline.storage=postgres \
            --set timeline.postgres.existingSecret=radar-postgres \
            --set timeline.retention=720h > /dev/null

      - name: Reject PostgreSQL storage without existingSecret
        run: |
          if helm template radar deploy/helm/radar \
            --set timeline.storage=postgres 2>/dev/null; then
            echo "ERROR: helm template should have failed with no existingSecret set"
            exit 1
          fi

      # Cross-render assertions helm-unittest can't express (it renders each
      # test in isolation), e.g. checksum/rbac changing only with rbac values.
      - name: Chart template smoke tests
        run: ./scripts/test-chart.sh

      - name: Intall helmfile
        uses: helmfile/helmfile-action@v2.4.8
        with:
          # Auto-init bypasses helm-version and keeps the earlier Helm 4 binary.
          helmfile-auto-init: 'false'
          # Helm 3 ONLY here: helm-unittest cannot run under Helm 4's plugin
          # layout (fork/exec untt: no such file) — upstream tracking issue
          # helm-unittest/helm-unittest#777. Lift to 4 when that closes.
          helm-version: v3.19.0
          helm-plugins: >
            https://github.com/helm-unittest/helm-unittest@v1.1.0

      - name: Run all helmfile unittests
        run: helmfile -f ./deploy/helm/ unittest
