name: Sync Helm chart to skyhook-io/helm-charts

# Canonical chart source lives in this repo at deploy/helm/radar/.
# This workflow opens a PR in skyhook-io/helm-charts mirroring
# charts/radar/ to the contents here, so the public Helm index at
# https://skyhook-io.github.io/helm-charts (and its ArtifactHub entry)
# stays in sync automatically.
#
# One-time setup:
#   1. Create a fine-grained PAT scoped to skyhook-io/helm-charts with
#      Contents: read/write and Pull requests: read/write.
#   2. Add it as repository secret HELM_CHARTS_SYNC_TOKEN in this repo.
# Without that secret the workflow no-ops on the PR-creation step.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/helm/radar/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync chart and open PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout radar
        uses: actions/checkout@v6
        with:
          path: radar

      - name: Read chart version
        id: chart
        run: |
          version=$(awk '/^version:/ {print $2}' radar/deploy/helm/radar/Chart.yaml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Chart version: ${version}"

      - name: Checkout helm-charts
        uses: actions/checkout@v6
        with:
          repository: skyhook-io/helm-charts
          token: ${{ secrets.HELM_CHARTS_SYNC_TOKEN }}
          path: helm-charts

      - name: Mirror chart contents
        run: |
          rm -rf helm-charts/charts/radar
          mkdir -p helm-charts/charts/radar
          cp -r radar/deploy/helm/radar/. helm-charts/charts/radar/

      - name: Detect changes
        id: diff
        working-directory: helm-charts
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No chart changes to sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: helm-charts
          token: ${{ secrets.HELM_CHARTS_SYNC_TOKEN }}
          branch: radar/sync-${{ steps.chart.outputs.version }}
          base: main
          commit-message: |
            radar: sync chart to ${{ steps.chart.outputs.version }}

            Auto-synced from skyhook-io/radar@${{ github.sha }}.
            Source of truth is radar/deploy/helm/radar/.
          title: "radar: sync chart to ${{ steps.chart.outputs.version }}"
          body: |
            Auto-synced from [skyhook-io/radar@${{ github.sha }}](https://github.com/skyhook-io/radar/commit/${{ github.sha }}).

            Source of truth is `deploy/helm/radar/` in the radar repo. Do not edit `charts/radar/` here directly — changes will be overwritten on the next sync. Make chart changes in the radar repo and they'll land here automatically.
          delete-branch: true
