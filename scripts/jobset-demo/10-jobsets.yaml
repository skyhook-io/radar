apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: roles-running
  namespace: jobset-demo
spec:
  replicatedJobs:
    - name: leader
      groupName: training
      replicas: 1
      template:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: leader
                  image: registry.k8s.io/pause:3.10
    - name: workers
      groupName: training
      replicas: 2
      template:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: registry.k8s.io/pause:3.10
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dependency-held
  namespace: jobset-demo
spec:
  replicatedJobs:
    - name: initializer
      replicas: 1
      template:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: initializer
                  image: registry.k8s.io/pause:3.10
    - name: workers
      replicas: 2
      dependsOn:
        - name: initializer
          status: Complete
      template:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: registry.k8s.io/pause:3.10
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: terminal-failure
  namespace: jobset-demo
spec:
  failurePolicy:
    maxRestarts: 0
    rules:
      - name: failWorker
        action: FailJobSet
        targetReplicatedJobs:
          - workers
        onJobFailureReasons:
          - BackoffLimitExceeded
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
                  command:
                    - /bin/sh
                    - -c
                    - exit 42
