# Submitted first; `up` waits for the states listed in each comment before
# changing queue configuration or submitting 40-jobs-second.yaml.
# Scenario 1: admitted first; holds most of the 200m quota.
apiVersion: batch/v1
kind: Job
metadata:
  name: fits
  namespace: ${PREFIX}-quota
  labels:
    radar.skyhook.io/fixture: ${FIXTURE}
    radar.skyhook.io/kueue-scenarios: ${PREFIX}
    kueue.x-k8s.io/queue-name: quota
spec:
  suspend: true
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        radar.skyhook.io/fixture: ${FIXTURE}
        radar.skyhook.io/kueue-scenarios: ${PREFIX}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hold
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 150m
              memory: 64Mi
---
