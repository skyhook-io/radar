# Submitted after 30-jobs-first.yaml has settled.
# Scenario 1: fits nominal quota, but fits already holds it.
apiVersion: batch/v1
kind: Job
metadata:
  name: waits-for-quota
  namespace: ${PREFIX}-quota
  labels:
    radar.skyhook.io/fixture: ${FIXTURE}
    radar.skyhook.io/kueue-scenarios: ${PREFIX}
    kueue.x-k8s.io/queue-name: quota
spec:
  suspend: true
  parallelism: 1
  completions: 1
  backoffLimit: 0
  # A node drain, consolidation or spot interruption must not end the Job and
  # with it the admitted state; only the busybox Jobs are meant to finish.
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
            status: "True"
  template:
    metadata:
      labels:
        radar.skyhook.io/fixture: ${FIXTURE}
        radar.skyhook.io/kueue-scenarios: ${PREFIX}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hold
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
