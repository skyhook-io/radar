# Every object carries the ownership label radar.skyhook.io/kueue-scenarios=${PREFIX};
# `down` deletes only labeled objects named with the prefix, and these namespaces
# with everything in them. Namespaces Kueue may admit from also
# carry radar.skyhook.io/kueue-eligible=${PREFIX}; ${PREFIX}-ineligible omits it on purpose.
apiVersion: v1
kind: Namespace
metadata:
  name: ${PREFIX}-quota
  labels:
    radar.skyhook.io/fixture: ${FIXTURE}
    radar.skyhook.io/kueue-scenarios: ${PREFIX}
    radar.skyhook.io/kueue-eligible: ${PREFIX}
---
