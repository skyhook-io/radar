apiVersion: batch/v1
kind: Job
metadata:
  name: admitted-running
  namespace: kueue-demo
  labels:
    app.kubernetes.io/part-of: radar-kueue-demo
    kueue.x-k8s.io/queue-name: ready
spec:
  suspend: true
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: radar-kueue-demo
    spec:
      containers:
        - name: hold
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 500m
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: quota-blocked
  namespace: kueue-demo
  labels:
    app.kubernetes.io/part-of: radar-kueue-demo
    kueue.x-k8s.io/queue-name: ready
spec:
  suspend: true
  parallelism: 1
  completions: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: radar-kueue-demo
    spec:
      containers:
        - name: would-run
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "3"
      restartPolicy: Never
---
