apiVersion: v1
kind: Namespace
metadata:
  name: ig-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: ig-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ig-demo-server
  template:
    metadata:
      labels:
        app: ig-demo-server
    spec:
      containers:
        - name: server
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: ig-demo
spec:
  selector:
    app: ig-demo-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: ig-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ig-demo-probe
  template:
    metadata:
      labels:
        app: ig-demo-probe
      annotations:
        kubectl.kubernetes.io/default-container: probe
    spec:
      containers:
        - name: probe
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                nslookup server.ig-demo.svc.cluster.local >/dev/null 2>&1 || true
                nslookup intentionally-missing.ig-demo.svc.cluster.local >/dev/null 2>&1 || true
                wget -q -O /dev/null http://server.ig-demo.svc.cluster.local || true
                sleep 2
              done
        - name: sidecar
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
