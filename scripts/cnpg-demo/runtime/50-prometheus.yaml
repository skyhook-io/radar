# Minimal Prometheus scraping CNPG instances (:9187) and poolers (:9127).
#
# Named `prometheus-server` in `monitoring`, port 9090, labelled
# app.kubernetes.io/name=prometheus: that is an exact entry in Radar's
# well-known discovery list (pkg/prom/discovery.go WellKnownLocations), so
# Radar finds it with a targeted Service GET — no cluster-wide Service list, no
# scoring heuristics — and port-forwards to it when running off-cluster.
#
# Pod-role service discovery, no prometheus-operator: the Cluster sets
# enablePodMonitor: false, and a PodMonitor CR would need CRDs this demo does not
# install. Every target keeps `namespace` and `pod`, which is what Radar's
# per-resource queries join on, plus `cluster` from the cnpg.io/cluster label.
#
# The kubelet job reaches each node's kubelet through the apiserver's node
# proxy (/api/v1/nodes/<node>/proxy/metrics), so it needs `get nodes/proxy`
# and no kubelet port or certificate from inside kind. It keeps only
# kubelet_volume_stats_*, the series Radar's volume usage reads. kind's default
# local-path class provisions hostPath volumes, which kubelet does not measure:
# those claims have no series, and Radar says so rather than showing 0.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-demo-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-demo-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-demo-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      # Every CNPG instance pod in every namespace — the frozen `pg` fixtures
      # included; their instance managers keep serving metrics while frozen.
      # Keyed on podRole=instance, not on cnpg.io/cluster alone: Pooler pods
      # carry cnpg.io/cluster too.
      - job_name: cnpg-instances
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_podRole]
            action: keep
            regex: instance
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9187"
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            target_label: cluster
      - job_name: cnpg-poolers
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_labelpresent_cnpg_io_poolerName]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9127"
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            target_label: cluster
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_poolerName]
            target_label: pooler
      - job_name: kubelet
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: kubelet_volume_stats_.*
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-server
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.enable-lifecycle
          ports:
            - { containerPort: 9090, name: http }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-server
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: 9090 }
