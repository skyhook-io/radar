apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferencePool
metadata:
  name: shared-llm-pool
  namespace: gpu-demo
  labels:
    radar.skyhook.io/test-fixture: gpu-ecosystem
spec:
  selector:
    app: vllm
    model-family: qwen
  targetPortNumber: 8000
  extensionRef:
    name: endpoint-picker
    portNumber: 9002
status:
  parent:
    - parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        namespace: gpu-demo
        name: inference-gateway
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          message: Pool accepted by the gateway
          observedGeneration: 1
          lastTransitionTime: __START_TIME__
        - type: ResolvedRefs
          status: "True"
          reason: ResolvedRefs
          message: Endpoint picker reference resolved
          observedGeneration: 1
          lastTransitionTime: __START_TIME__
---
apiVersion: inference.networking.x-k8s.io/v1alpha2
kind: InferenceObjective
metadata:
  name: premium-traffic
  namespace: gpu-demo
  labels:
    radar.skyhook.io/test-fixture: gpu-ecosystem
spec:
  priority: 100
  poolRef:
    group: inference.networking.x-k8s.io
    name: shared-llm-pool
status:
  conditions:
    - type: Accepted
      status: "True"
      reason: Accepted
      message: Objective accepted by the endpoint picker
      observedGeneration: 1
      lastTransitionTime: __START_TIME__
