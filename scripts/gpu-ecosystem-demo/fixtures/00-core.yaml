apiVersion: v1
kind: Namespace
metadata:
  name: gpu-demo
  labels:
    radar.skyhook.io/test-fixture: gpu-ecosystem
---
apiVersion: v1
kind: PodTemplate
metadata:
  name: reserved-gpu-pods
  namespace: gpu-demo
template:
  spec:
    restartPolicy: Never
    containers:
      - name: worker
        image: registry.k8s.io/pause:3.10
        resources:
          limits:
            nvidia.com/gpu: 1
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 100000
globalDefault: false
description: Priority used by the GPU ecosystem rendering fixtures
---
apiVersion: batch/v1
kind: Job
metadata:
  name: collision-demo
  namespace: gpu-demo
  labels:
    radar.skyhook.io/test-fixture: gpu-ecosystem
spec:
  suspend: true
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: registry.k8s.io/pause:3.10
          resources:
            limits:
              nvidia.com/gpu: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-demand
  namespace: gpu-demo
  labels:
    radar.skyhook.io/test-fixture: gpu-ecosystem
spec:
  restartPolicy: Never
  containers:
    - name: inference
      image: registry.k8s.io/pause:3.10
      resources:
        limits:
          nvidia.com/gpu: 2
