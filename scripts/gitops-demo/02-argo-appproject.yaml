# Custom AppProject that scopes the demo apps to the public
# argocd-example-apps repo + this cluster. Exists primarily to give
# the GitOps fleet view a non-default Project to filter on. Most
# demo Applications below set spec.project: radar-demo to use it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: radar-demo
  namespace: argocd
spec:
  description: Curated radar visual-test scenarios
  sourceRepos:
    - https://github.com/argoproj/argocd-example-apps
    - https://github.com/argoproj/argocd-example-apps.git
    # The argo3-health scenario sources its manifests from this repository.
    - https://github.com/skyhook-io/radar
    - https://github.com/skyhook-io/radar.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: 'demo-*'
    # The app-of-apps parent deploys child Application CRs (which live
    # in the argocd namespace by Argo convention). Without this entry,
    # the parent fails with InvalidSpecError and never creates children.
    - server: https://kubernetes.default.svc
      namespace: argocd
    # guestbook-remote targets a cluster this Argo doesn't have; the project
    # must still allow the destination or the app fails on the project rule
    # instead of the (intended) unknown-cluster condition.
    - server: https://spoke-1.example.com:6443
      namespace: 'demo-*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ''
      kind: '*'
    - group: apps
      kind: '*'
    - group: networking.k8s.io
      kind: '*'
    - group: radar.demo
      kind: '*'
