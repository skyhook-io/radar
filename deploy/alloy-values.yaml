# Grafana Alloy Helm values for K8s metrics collection
# Deploys as DaemonSet, scrapes cAdvisor + node metrics, writes to VictoriaMetrics

alloy:
  configMap:
    content: |
      // ============================================================
      // Remote write destination: VictoriaMetrics
      // ============================================================
      prometheus.remote_write "victoriametrics" {
        endpoint {
          url = "http://victoria-metrics-victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write"
        }
      }

      // ============================================================
      // Kubernetes discovery for nodes (used by cAdvisor + kubelet)
      // ============================================================
      discovery.kubernetes "nodes" {
        role = "node"
      }

      // ============================================================
      // cAdvisor metrics (container CPU, memory, network, filesystem)
      // ============================================================
      discovery.relabel "cadvisor" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          replacement = "/api/v1/nodes/${1}/proxy/metrics/cadvisor"
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "__metrics_path__"
        }

        rule {
          replacement   = "kubernetes.default.svc:443"
          target_label  = "__address__"
        }
      }

      prometheus.scrape "cadvisor" {
        targets    = discovery.relabel.cadvisor.output
        scheme     = "https"
        scrape_interval = "30s"

        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

        tls_config {
          ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          insecure_skip_verify = false
        }

        forward_to = [prometheus.remote_write.victoriametrics.receiver]
      }

      // ============================================================
      // Kubelet metrics (kubelet internal metrics)
      // ============================================================
      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          replacement = "/api/v1/nodes/${1}/proxy/metrics"
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "__metrics_path__"
        }

        rule {
          replacement   = "kubernetes.default.svc:443"
          target_label  = "__address__"
        }
      }

      prometheus.scrape "kubelet" {
        targets    = discovery.relabel.kubelet.output
        scheme     = "https"
        scrape_interval = "30s"

        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

        tls_config {
          ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          insecure_skip_verify = false
        }

        forward_to = [prometheus.remote_write.victoriametrics.receiver]
      }

      // ============================================================
      // Built-in node exporter (node_cpu_seconds_total, node_memory_*, etc.)
      // ============================================================
      prometheus.exporter.unix "node" {
      }

      prometheus.scrape "node" {
        targets    = prometheus.exporter.unix.node.targets
        scrape_interval = "30s"
        forward_to = [prometheus.remote_write.victoriametrics.receiver]
      }

controller:
  type: daemonset

serviceAccount:
  create: true

rbac:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
