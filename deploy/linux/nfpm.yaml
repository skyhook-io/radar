name: radar-desktop
arch: amd64
platform: linux
version: ${VERSION}
maintainer: Skyhook <support@skyhook.io>
description: "Kubernetes visibility — topology, traffic, and Helm management"
vendor: Skyhook
homepage: https://github.com/skyhook-io/radar
license: Apache-2.0
contents:
  - src: build/bin/radar-desktop
    dst: /usr/bin/radar-desktop
  - src: deploy/linux/radar-desktop.desktop
    dst: /usr/share/applications/radar-desktop.desktop
  - src: build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/radar-desktop.png
  # Tells Radar it was installed from this package, so it offers no in-app
  # update (internal/updater/mode_linux.go). Looked up relative to the binary.
  - src: deploy/linux/is-packaged-app
    dst: /usr/share/radar-desktop/is-packaged-app
overrides:
  deb:
    depends:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
  rpm:
    depends:
      - libgtk-3.so.0()(64bit)
      - libwebkit2gtk-4.1.so.0()(64bit)
