{{- /*
Default ClusterRoleBindings for Radar Hub identity groups. Emitted only when
hub.enabled=true and hub.defaultRbac.create=true (the default).

Hub injects identity headers on every proxied request:
  X-Forwarded-User:   <workos user id>
  X-Forwarded-Groups: hub:<role>,hub:org:<org_id>,hub:user:<user_id>

Radar runs with --auth-mode=proxy under hub-mode, so K8s sees the request as
that impersonated identity. These bindings grant default capability per role:

  hub:owner   → cluster-admin (can be tightened via values)
  hub:member  → K8s "edit" role (read+write on standard resources, no RBAC)
  hub:viewer  → K8s "view" role (read-only)

Cluster operators can disable any of these (set hub.defaultRbac.<role>=false)
and author their own bindings — e.g., per-namespace RoleBindings, or bindings
for hub:user:<id> groups to grant individuals extra access.
*/}}
{{- if and .Values.hub.enabled .Values.hub.defaultRbac.create -}}
{{- if .Values.hub.defaultRbac.owner -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "radar.fullname" . }}-hub-owner
  labels:
    {{- include "radar.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.hub.defaultRbac.ownerClusterRole }}
subjects:
  - kind: Group
    name: hub:owner
    apiGroup: rbac.authorization.k8s.io
---
{{- end }}
{{- if .Values.hub.defaultRbac.member -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "radar.fullname" . }}-hub-member
  labels:
    {{- include "radar.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.hub.defaultRbac.memberClusterRole }}
subjects:
  - kind: Group
    name: hub:member
    apiGroup: rbac.authorization.k8s.io
---
{{- end }}
{{- if .Values.hub.defaultRbac.viewer -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "radar.fullname" . }}-hub-viewer
  labels:
    {{- include "radar.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.hub.defaultRbac.viewerClusterRole }}
subjects:
  - kind: Group
    name: hub:viewer
    apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end -}}
