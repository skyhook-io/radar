suite: Cloud radar:system RBAC
templates:
  - cloud-rbac-system.yaml
  - cloud-rbac-cluster-read.yaml
  - cloud-rbac-integration-read.yaml
tests:
  - it: aggregates the owned read role exactly like view without feeding view
    set:
      cloud:
        enabled: true
        token: dummy
        url: "wss://cloud.example"
        clusterName: test-cluster
    template: cloud-rbac-system.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: RELEASE-NAME-radar-cloud-system-read
      - equal:
          path: aggregationRule
          value:
            clusterRoleSelectors:
              - matchLabels:
                  rbac.authorization.k8s.io/aggregate-to-view: "true"
      - notExists:
          path: rules
      - notExists:
          path: metadata.labels["rbac.authorization.k8s.io/aggregate-to-view"]
      - notExists:
          path: metadata.labels["rbac.authorization.k8s.io/aggregate-to-edit"]
      - notExists:
          path: metadata.labels["rbac.authorization.k8s.io/aggregate-to-admin"]

  - it: keeps radar:system's read binding when the tier bindings are off
    set:
      cloud:
        enabled: true
        token: dummy
        url: "wss://cloud.example"
        clusterName: test-cluster
        defaultRbac:
          create: false
    template: cloud-rbac-system.yaml
    documentIndex: 1
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: RELEASE-NAME-radar-cloud-system-read
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-radar-cloud-system-read
      - isKind:
          of: ClusterRoleBinding

  - it: keeps the cluster-read role for radar:system alone when the role bindings are off
    set:
      cloud:
        enabled: true
        token: dummy
        url: "wss://cloud.example"
        clusterName: test-cluster
        defaultRbac:
          create: false
        aiRbac: false
    template: cloud-rbac-cluster-read.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-radar-cloud-system-cluster-read
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: radar:system
        documentIndex: 1

  - it: grants Secret read only, no writes
    set:
      cloud:
        enabled: true
        token: dummy
        url: "wss://cloud.example"
        clusterName: test-cluster
    template: cloud-rbac-system.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-radar-system-secrets-read
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "list", "watch"]

  - it: binds Secret read to radar:system
    set:
      cloud:
        enabled: true
        token: dummy
        url: "wss://cloud.example"
        clusterName: test-cluster
    template: cloud-rbac-system.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-radar-cloud-system-secrets-read
    asserts:
      - equal:
          path: subjects
          value:
            - kind: Group
              name: radar:system
              apiGroup: rbac.authorization.k8s.io

  - it: binds only radar:system to the owned read role
    set:
      cloud:
        enabled: true
        token: dummy
        url: "wss://cloud.example"
        clusterName: test-cluster
    template: cloud-rbac-system.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: RELEASE-NAME-radar-cloud-system-read
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: RELEASE-NAME-radar-cloud-system-read
      - equal:
          path: subjects
          value:
            - kind: Group
              name: radar:system
              apiGroup: rbac.authorization.k8s.io

  # --reuse-values from a release predating systemRbac renders with the key
  # absent: nothing renders, so an existing install never gains Secret read
  # without choosing it.
  - it: renders nothing when systemRbac is absent from reused values
    set:
      cloud:
        enabled: true
        token: dummy
        url: "wss://cloud.example"
        clusterName: test-cluster
        systemRbac: null
    template: cloud-rbac-system.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the owned read role and binding plus Secret read by default
    set:
      cloud:
        enabled: true
        token: dummy
        url: "wss://cloud.example"
        clusterName: test-cluster
    template: cloud-rbac-system.yaml
    asserts:
      - hasDocuments:
          count: 4

  - it: renders nothing when systemRbac is false
    set:
      cloud:
        enabled: true
        token: dummy
        url: "wss://cloud.example"
        clusterName: test-cluster
        systemRbac: false
    template: cloud-rbac-system.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing outside cloud mode
    template: cloud-rbac-system.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when the operator owns all RBAC
    set:
      rbac:
        create: false
      cloud:
        enabled: true
        token: dummy
        url: "wss://cloud.example"
        clusterName: test-cluster
    template: cloud-rbac-system.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: gives radar:system the integration-read add-on without the tiers
    set:
      cloud:
        enabled: true
        token: dummy
        url: "wss://cloud.example"
        clusterName: test-cluster
        defaultRbac:
          create: false
    template: cloud-rbac-integration-read.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-radar-cloud-system-integration-read-namespaced
    asserts:
      - equal:
          path: subjects
          value:
            - kind: Group
              name: radar:system
              apiGroup: rbac.authorization.k8s.io
