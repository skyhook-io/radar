suite: MetalLB collection reads only the curated kinds and ConfigurationStates
templates:
  - clusterrole.yaml
tests:
  - it: grants read access to pools, advertisements, peers and configuration states by default
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["metallb.io"]
            resources: ["ipaddresspools", "l2advertisements", "bgpadvertisements", "bgppeers", "configurationstates"]
            verbs: ["get", "list", "watch"]
  - it: removes the grant when disabled
    set:
      rbac.crdGroups.metallb: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["metallb.io"]
            resources: ["ipaddresspools", "l2advertisements", "bgpadvertisements", "bgppeers", "configurationstates"]
            verbs: ["get", "list", "watch"]
