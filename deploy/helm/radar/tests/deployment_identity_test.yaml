suite: deployment identity env
templates:
  - deployment.yaml
tests:
  # Radar needs to know which object it is to describe itself for the Cloud
  # connect handoff. That is read-only and must not depend on the RBAC that
  # lets it patch itself, which is off by default.
  - it: ships downward-API identity without self-upgrade RBAC
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_DEPLOYMENT_NAME
            value: RELEASE-NAME-radar
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_SELF_UPGRADE
            value: "true"

  - it: marks self-upgrade only when its RBAC is enabled
    set:
      rbac.selfUpgrade: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_SELF_UPGRADE
            value: "true"
