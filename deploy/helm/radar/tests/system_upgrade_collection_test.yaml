suite: system-upgrade-controller collection is explicitly opt-in
templates:
  - clusterrole.yaml
tests:
  - it: does not expand default collection permissions
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["upgrade.cattle.io"]
            resources: ["plans"]
            verbs: ["get", "list", "watch"]
  - it: grants only native read collection when explicitly enabled
    set:
      rbac.crdGroups.systemUpgrade: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["upgrade.cattle.io"]
            resources: ["plans"]
            verbs: ["get", "list", "watch"]
