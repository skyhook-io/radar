suite: Secrets read RBAC
templates:
  - clusterrole.yaml
tests:
  - it: omits cluster-wide Secret read when no feature enables it
    set:
      rbac:
        secrets: false
        helm: false
      auth:
        mode: none
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "list", "watch"]
      # rbac.traffic defaults on, so a resourceNames-scoped Secret rule remains.
      # Without it the assertion above would pass for the wrong reason.
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["hubble-relay-client-certs"]
            verbs: ["get"]

  - it: grants cluster-wide Secret read under auth even when rbac.secrets is false
    set:
      rbac:
        secrets: false
        helm: false
      auth:
        mode: oidc
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "list", "watch"]

  - it: grants cluster-wide Secret read in cloud mode even when rbac.secrets is false
    set:
      rbac:
        secrets: false
        helm: false
      auth:
        mode: none
      cloud:
        enabled: true
        token: dummy
        url: "wss://cloud.example"
        clusterName: test-cluster
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "list", "watch"]

  - it: grants cluster-wide Secret read for Helm release storage even when rbac.secrets is false
    set:
      rbac:
        secrets: false
        helm: true
      auth:
        mode: none
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["secrets"]
            verbs: ["get", "list", "watch"]
