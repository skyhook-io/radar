suite: Radar Cloud users can read Kargo, except the webhook receiver configs
templates:
  - cloud-rbac-integration-read.yaml
set:
  cloud.enabled: true
  cloud.token: dummy
  cloud.url: wss://cloud.example
  cloud.clusterName: test
tests:
  - it: grants the namespaced Kargo kinds the pipelines screen reads
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-radar-integration-read-namespaced
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["kargo.akuity.io"]
            resources: ["freights", "promotionrequests", "promotions", "promotiontasks", "stages", "targets", "warehouses"]
            verbs: ["get", "list", "watch"]
  - it: grants Kargo Projects and ClusterPromotionTasks
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-radar-integration-read-cluster
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["kargo.akuity.io"]
            resources: ["clusterpromotiontasks", "projects"]
            verbs: ["get", "list", "watch"]
  - it: grants nothing for Kargo when its collection is off
    set:
      rbac.crdGroups.kargo: false
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-radar-integration-read-namespaced
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["kargo.akuity.io"]
            resources: ["freights", "promotionrequests", "promotions", "promotiontasks", "stages", "targets", "warehouses"]
            verbs: ["get", "list", "watch"]
  - it: grants Kargo when the key is missing, as after a --reuse-values upgrade from an older release
    set:
      rbac.crdGroups.kargo: null
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-radar-integration-read-namespaced
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["kargo.akuity.io"]
            resources: ["freights", "promotionrequests", "promotions", "promotiontasks", "stages", "targets", "warehouses"]
            verbs: ["get", "list", "watch"]
