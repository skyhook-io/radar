suite: cloud enrollment
templates:
  - deployment.yaml
  - cloud-enrollment.yaml
  - clusterrole.yaml
release:
  name: radar
  namespace: radar
tests:
  - it: renders nothing for enrollment by default
    template: cloud-enrollment.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: a configured token wins over an enrollment key
    set:
      cloud:
        enabled: true
        url: wss://hub.example.com/agent
        clusterName: prod
        existingSecret: radar-cloud-config
        hubURL: https://hub.example.com
        enrollment:
          key: rhe_AbCdEfGhIjKlMnOpQrStUvWxYz0123456789_-abcd
    asserts:
      - template: cloud-enrollment.yaml
        hasDocuments:
          count: 0
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --cloud-url=wss://hub.example.com/agent
      - template: deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].args
          content: --cloud-enrollment-key-file=/etc/radar/cloud-enrollment/key

  - it: enrollment with an inline key renders the args, mounts and Recreate
    template: deployment.yaml
    set:
      cloud:
        enabled: true
        hubURL: https://hub.example.com
        enrollment:
          key: rhe_AbCdEfGhIjKlMnOpQrStUvWxYz0123456789_-abcd
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cloud-hub-url=https://hub.example.com
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cloud-enrollment-key-file=/etc/radar/cloud-enrollment/key
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cloud-token-secret=radar-cloud-token
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_CLOUD_TOKEN
          any: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: cloud-enrollment-key
            mountPath: /etc/radar/cloud-enrollment
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cloud-enrollment-key
            secret:
              secretName: radar-cloud-enrollment-key
              items:
                - key: key
                  path: key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_CLOUD_MODE
            value: "true"

  - it: the token Secret has no data and survives uninstall and pruning
    template: cloud-enrollment.yaml
    set:
      cloud:
        enabled: true
        hubURL: https://hub.example.com
        enrollment:
          existingSecret: hub-enrollment
    documentSelector:
      path: kind
      value: Secret
    asserts:
      - equal:
          path: metadata.name
          value: radar-cloud-token
      - notExists:
          path: data
      - notExists:
          path: stringData
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false,Delete=false

  - it: the Role reaches only the token Secret and cannot create or delete
    template: cloud-enrollment.yaml
    set:
      cloud:
        enabled: true
        hubURL: https://hub.example.com
        tokenSecretName: my-token
        enrollment:
          existingSecret: hub-enrollment
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["secrets"]
              resourceNames: ["my-token"]
              verbs: ["get", "list", "watch", "update"]

  - it: an existingSecret key is mounted, and no key Secret is rendered
    set:
      cloud:
        enabled: true
        hubURL: https://hub.example.com
        clusterName: edge-01
        clusterNamePrefix: nkp-
        enrollment:
          existingSecret: hub-enrollment
          existingSecretKey: enroll
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.volumes
          content:
            name: cloud-enrollment-key
            secret:
              secretName: hub-enrollment
              items:
                - key: enroll
                  path: key
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --cluster-name=edge-01
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --cluster-name-prefix=nkp-
      - template: cloud-enrollment.yaml
        hasDocuments:
          count: 3

  - it: a CA bundle is mounted and passed to Radar
    set:
      cloud:
        enabled: true
        hubURL: https://hub.example.com
        enrollment:
          existingSecret: hub-enrollment
        caBundleConfigMap:
          name: corp-ca
          key: bundle.pem
    asserts:
      - template: deployment.yaml
        contains:
          path: spec.template.spec.containers[0].args
          content: --cloud-ca-file=/etc/radar/cloud-ca/ca.crt
      - template: deployment.yaml
        contains:
          path: spec.template.spec.volumes
          content:
            name: cloud-ca
            configMap:
              name: corp-ca
              items:
                - key: bundle.pem
                  path: ca.crt

  - it: refuses more than one replica
    template: deployment.yaml
    set:
      replicaCount: 2
      cloud:
        enabled: true
        hubURL: https://hub.example.com
        enrollment:
          existingSecret: hub-enrollment
    asserts:
      - failedTemplate:
          errorPattern: "replicaCount must be 1"

  - it: refuses an image older than enrollment support
    template: deployment.yaml
    set:
      image:
        tag: 1.18.0
      cloud:
        enabled: true
        hubURL: https://hub.example.com
        enrollment:
          existingSecret: hub-enrollment
    asserts:
      - failedTemplate:
          errorPattern: "requires Radar 1.19.0 or later"

  - it: refuses an old image for a CA bundle in token mode too
    template: deployment.yaml
    set:
      image:
        tag: 1.18.0
      cloud:
        enabled: true
        url: wss://hub.example.com/agent
        clusterName: prod
        existingSecret: radar-cloud-config
        caBundleConfigMap:
          name: corp-ca
    asserts:
      - failedTemplate:
          errorPattern: "cloud.caBundle / cloud.caBundleConfigMap requires Radar 1.19.0 or later"

  - it: an old image without enrollment or a CA bundle still renders
    template: deployment.yaml
    set:
      image:
        tag: 1.18.0
      cloud:
        enabled: true
        url: wss://hub.example.com/agent
        clusterName: prod
        existingSecret: radar-cloud-config
    asserts:
      - notFailedTemplate: {}

  - it: a CA bundle with a current image renders the CA flag in token mode
    template: deployment.yaml
    set:
      image:
        tag: 1.19.0
      cloud:
        enabled: true
        url: wss://hub.example.com/agent
        clusterName: prod
        existingSecret: radar-cloud-config
        caBundle: |
          -----BEGIN CERTIFICATE-----
          MIIB
          -----END CERTIFICATE-----
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --cloud-ca-file=/etc/radar/cloud-ca/ca.crt

  - it: refuses insecureSkipVerify with an enrollment key
    template: deployment.yaml
    set:
      cloud:
        enabled: true
        hubURL: https://hub.example.com
        insecureSkipVerify: true
        enrollment:
          existingSecret: hub-enrollment
    asserts:
      - failedTemplate:
          errorPattern: "cannot be used with cloud.enrollment"

  - it: refuses both an inline key and an existingSecret
    template: deployment.yaml
    set:
      cloud:
        enabled: true
        hubURL: https://hub.example.com
        enrollment:
          key: rhe_AbCdEfGhIjKlMnOpQrStUvWxYz0123456789_-abcd
          existingSecret: hub-enrollment
    asserts:
      - failedTemplate:
          errorPattern: "mutually exclusive"

  - it: refuses user-token mode over a plaintext Hub URL
    template: clusterrole.yaml
    set:
      auth:
        kubernetesCredentials: user-token
      cloud:
        enabled: true
        hubURL: http://hub.example.com
        defaultRbac:
          create: false
        enrollment:
          existingSecret: hub-enrollment
    asserts:
      - failedTemplate:
          errorPattern: "needs a verified tunnel"

  - it: without a token or key, cloud.enabled still fails
    template: deployment.yaml
    set:
      cloud:
        enabled: true
        url: wss://hub.example.com/agent
        clusterName: prod
    asserts:
      - failedTemplate:
          errorPattern: "cloud.token or cloud.existingSecret must be set"
