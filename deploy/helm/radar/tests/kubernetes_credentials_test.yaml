suite: kubernetes credentials mode
templates:
  - templates/clusterrole.yaml
  - templates/deployment.yaml
tests:
  - it: grants impersonate by default under cloud mode
    template: templates/clusterrole.yaml
    set:
      cloud.enabled: true
      cloud.token: rhc_test
      cloud.url: wss://hub.example.com/agent
      cloud.clusterName: test
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["users", "groups"]
            verbs: ["impersonate"]
  - it: grants no impersonate in user-token mode, keeps SubjectAccessReview
    template: templates/clusterrole.yaml
    set:
      cloud.enabled: true
      cloud.token: rhc_test
      cloud.url: wss://hub.example.com/agent
      cloud.clusterName: test
      auth.kubernetesCredentials: user-token
      cloud.defaultRbac.create: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["users", "groups"]
            verbs: ["impersonate"]
      - contains:
          path: rules
          content:
            apiGroups: ["authorization.k8s.io"]
            resources: ["subjectaccessreviews"]
            verbs: ["create"]
  - it: sets the credential mode env in user-token mode
    template: templates/deployment.yaml
    set:
      cloud.enabled: true
      cloud.token: rhc_test
      cloud.url: wss://hub.example.com/agent
      cloud.clusterName: test
      auth.kubernetesCredentials: user-token
      cloud.defaultRbac.create: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_AUTH_K8S_CREDENTIALS
            value: user-token
  - it: omits the env by default
    template: templates/deployment.yaml
    set:
      cloud.enabled: true
      cloud.token: rhc_test
      cloud.url: wss://hub.example.com/agent
      cloud.clusterName: test
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RADAR_AUTH_K8S_CREDENTIALS
            value: user-token
  - it: refuses user-token outside cloud mode
    template: templates/clusterrole.yaml
    set:
      auth.mode: proxy
      auth.kubernetesCredentials: user-token
      cloud.defaultRbac.create: false
    asserts:
      - failedTemplate:
          errorPattern: "requires cloud.enabled=true"
  - it: refuses user-token while the Hub-role bindings are on
    template: templates/clusterrole.yaml
    set:
      cloud.enabled: true
      cloud.token: rhc_test
      cloud.url: wss://hub.example.com/agent
      cloud.clusterName: test
      auth.kubernetesCredentials: user-token
    asserts:
      - failedTemplate:
          errorPattern: "requires cloud.defaultRbac.create=false"
  - it: drops the ServiceAccount's exec and port-forward grants in user-token mode
    template: templates/clusterrole.yaml
    set:
      cloud.enabled: true
      cloud.token: rhc_test
      cloud.url: wss://hub.example.com/agent
      cloud.clusterName: test
      cloud.defaultRbac.create: false
      auth.kubernetesCredentials: user-token
      rbac.podExec: true
      rbac.portForward: true
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - pods/exec
            verbs: ["create"]
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources:
              - pods/portforward
            verbs: ["create"]
  - it: refuses user-token over an unverified tunnel
    template: templates/clusterrole.yaml
    set:
      cloud.enabled: true
      cloud.token: rhc_test
      cloud.url: wss://hub.example.com/agent
      cloud.clusterName: test
      cloud.defaultRbac.create: false
      cloud.insecureSkipVerify: true
      auth.kubernetesCredentials: user-token
    asserts:
      - failedTemplate:
          errorPattern: "needs a verified tunnel"
  - it: refuses user-token over plain ws
    template: templates/clusterrole.yaml
    set:
      cloud.enabled: true
      cloud.token: rhc_test
      cloud.url: ws://hub.example.com/agent
      cloud.clusterName: test
      cloud.defaultRbac.create: false
      auth.kubernetesCredentials: user-token
    asserts:
      - failedTemplate:
          errorPattern: "needs a verified tunnel"
  - it: refuses user-token with an image pinned below 1.18.0
    template: templates/clusterrole.yaml
    set:
      cloud.enabled: true
      cloud.token: rhc_test
      cloud.url: wss://hub.example.com/agent
      cloud.clusterName: test
      cloud.defaultRbac.create: false
      auth.kubernetesCredentials: user-token
      image.tag: 1.17.0
    asserts:
      - failedTemplate:
          errorPattern: "requires Radar 1.18.0 or later, but image.tag pins 1.17.0"
  - it: accepts user-token with a pin from 1.18.0 on, or a tag it can't compare
    template: templates/clusterrole.yaml
    set:
      cloud.enabled: true
      cloud.token: rhc_test
      cloud.url: wss://hub.example.com/agent
      cloud.clusterName: test
      cloud.defaultRbac.create: false
      auth.kubernetesCredentials: user-token
      image.tag: 1.18.0-rc.1
    asserts:
      - notFailedTemplate: {}
  - it: ignores an old pin outside user-token mode
    template: templates/clusterrole.yaml
    set:
      image.tag: 1.17.0
    asserts:
      - notFailedTemplate: {}
