suite: Secrets Store CSI collection reads only the driver's two kinds
templates:
  - clusterrole.yaml
tests:
  - it: grants read access to classes and Pod statuses by default
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["secrets-store.csi.x-k8s.io"]
            resources: ["secretproviderclasses", "secretproviderclasspodstatuses"]
            verbs: ["get", "list", "watch"]
  - it: removes the grant when disabled
    set:
      rbac.crdGroups.secretsStoreCsi: false
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["secrets-store.csi.x-k8s.io"]
            resources: ["secretproviderclasses", "secretproviderclasspodstatuses"]
            verbs: ["get", "list", "watch"]
