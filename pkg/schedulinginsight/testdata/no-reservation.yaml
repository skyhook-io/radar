apiVersion: kueue.x-k8s.io/v1beta2
kind: Workload
metadata:
  name: no-reservation
  namespace: training
spec:
  queueName: gpu
  podSets:
    - name: workers
      count: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: trainer
              image: registry.k8s.io/pause:3.10
status:
  conditions:
    - type: Admitted
      status: "False"
      reason: NoReservation
      message: The workload has no reservation
      lastTransitionTime: "2026-08-30T10:00:00Z"
    - type: QuotaReserved
      status: "False"
      reason: NoMatchingFlavor
      message: No ResourceFlavor matches nvidia.com/gpu
      lastTransitionTime: "2026-08-30T10:01:00Z"
